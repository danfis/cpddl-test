# Configuration for tests/scripts/test-tool.py

# Maximum memory in MB passed as --max-mem MEM (first option to pddl-tool)
max-mem = 4096

# Maximum time enforced with `timeout TIME` (e.g., "5m", "30s")
max-time = "5m"

# Options common to ALL test calls (appended after --max-mem)
common-options = []

# Maximum allowed size of .out.tmp and .output.*.tmp files in bytes (default 5 MB)
max-output-size = 5242880

# Base bwrap (bubblewrap) options used when --bwrap is passed to the script.
# Per-test writable output files are added automatically as --bind pairs.
bwrap_options = [
    "--ro-bind", "/", "/",
    "--proc", "/proc",
    "--dev", "/dev",
    "--tmpfs", "/tmp",
    "--die-with-parent",
]

# Tasks to test (relative to tests/pddl/)
tasks = [
    "ipc-1998/gripper/prob01",
    "ipc-2002/depot/pfile1",
    "ipc-1998/movie/prob01",
    "ipc-1998/mystery/prob01",
    "ipc-2002/depot/pfile1",
    "ipc-2002/driverlog/pfile1",
    "ipc-2002/rovers/pfile1",
    "ipc-2002/zenotravel/pfile1",
    "ipc-2008/seq-opt/openstacks/p01",
    "ipc-2008/seq-opt/pegsol/p01",
    "ipc-2008/seq-opt/scanalyzer/p01",
    "ipc-2008/seq-opt/sokoban/p01",
    "ipc-2011/seq-opt/visitall/problem02-full",
    "ipc-2014/seq-opt/transport/p01",
]

# Named test configurations.
# Each key is the <test-name>; the value is a list of OPTIONS tokens.
# Use <OUT> as a placeholder that expands to reg/<task>/tool-<test-name>.output.
[tests]
# --- pddl ---
pddl = ["pddl", "--force-adl", "<OUT>domain.pddl", "<OUT>problem.pddl"]
pddl-default = ["pddl", "<OUT>domain.pddl", "<OUT>problem.pddl"]
pddl-ce = ["pddl", "--pddl-ce", "<OUT>domain.pddl", "<OUT>problem.pddl"]
pddl-unit-cost = ["pddl", "--pddl-unit-cost", "<OUT>domain.pddl", "<OUT>problem.pddl"]
pddl-disj-goal = ["pddl", "--pddl-disj-goal", "<OUT>domain.pddl", "<OUT>problem.pddl"]
pddl-neg-cond-all = ["pddl", "--pddl-neg-cond", "all", "<OUT>domain.pddl", "<OUT>problem.pddl"]
pddl-neg-cond-none = ["pddl", "--pddl-neg-cond", "none", "<OUT>domain.pddl", "<OUT>problem.pddl"]
pddl-lmg-fd = ["pddl", "--lmg", "fd", "<OUT>domain.pddl", "<OUT>problem.pddl"]
pddl-lmg-none = ["pddl", "--lmg", "none", "<OUT>domain.pddl", "<OUT>problem.pddl"]
pddl-lendo = ["pddl", "--lendo", "<OUT>domain.pddl", "<OUT>problem.pddl"]

# --- translate ---
translate-x = ["translate", "--fdr-var-alg", "essential-first", "<OUT>output.sas"]
translate = ["translate", "stdout"]
translate-h2 = ["translate", "--h2", "stdout"]
translate-ground-sql = ["translate", "-G", "sql", "stdout"]
translate-ground-trie = ["translate", "-G", "trie", "stdout"]
translate-fdr-h2fwbw = ["translate", "--fdr-h2fwbw", "stdout"]
translate-lmg-fd = ["translate", "--lmg", "fd", "stdout"]
translate-lmg-none = ["translate", "--lmg", "none", "stdout"]
translate-lendo = ["translate", "--lendo", "stdout"]
translate-mg-h2 = ["translate", "--mg", "h2", "stdout"]

# --- lmg ---
mg = ["lmg", "stdout"]
lmg-fd = ["lmg", "--lmg", "fd", "stdout"]
lmg-none = ["lmg", "--lmg", "none", "stdout"]

# --- strips-as-py ---
strips-as-py = ["strips-as-py", "stdout"]

# --- mutex-group-cover-number ---
mutex-group-cover-number-h2 = ["mutex-group-cover-number", "h2"]

# --- lplan ---
lplan-gbfs-ff = ["lplan", "gbfs", "ff", "/dev/null"]
lplan-gbfs-hadd = ["lplan", "gbfs", "hadd", "/dev/null"]
lplan-lazy-ff = ["lplan", "lazy", "ff", "/dev/null"]
lplan-lazy-hadd = ["lplan", "lazy", "hadd", "/dev/null"]
lplan-astar-hmax = ["lplan", "astar", "hmax", "/dev/null"]

# --- gplan ---
gplan-gbfs-ff = ["gplan", "gbfs", "ff", "/dev/null"]
gplan-gbfs-hadd = ["gplan", "gbfs", "hadd", "/dev/null"]
gplan-lazy-ff = ["gplan", "lazy", "ff", "/dev/null"]
gplan-lazy-hadd = ["gplan", "lazy", "hadd", "/dev/null"]
gplan-astar-lmc = ["gplan", "astar", "lmc", "/dev/null"]

# --- pot-conj-find ---
# --- pot-conj-exact-find ---
# --- red-black-fdr ---

# --- reversibility ---
reversibility-simple-1 = ["reversibility-simple", "1", "stdout"]
reversibility-simple-2 = ["reversibility-simple", "2", "stdout"]
reversibility-iterative-2 = ["reversibility-iterative", "2", "stdout"]

# --- symba ---
symba-astar-fw = ["symba", "astar", "fw", "/dev/null"]
symba-astar-bw = ["symba", "astar", "bw", "/dev/null"]
symba-gbfs-fw = ["symba", "gbfs", "fw", "/dev/null"]
symba-gbfs-fwbw = ["symba", "gbfs", "fwbw", "/dev/null"]
