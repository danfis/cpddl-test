# Configuration for tests/scripts/test-tool.py

# Path to the pddl-tool binary (relative to the tests/ directory)
binary = "../bin/pddl-tool"

# Path to pddl/config.h used to determine available features for requirements filtering
config-header = "../pddl/config.h"

# Maximum memory in MB passed as --max-mem MEM (first option to pddl-tool)
max-mem = 4096

# Maximum time enforced with `timeout TIME` (e.g., "5m", "30s")
max-time = "1m"

# Options common to ALL test calls (appended after --max-mem)
common-options = []

# Maximum allowed size of .out.tmp and .output.*.tmp files in bytes (default 5 MB)
max-output-size = 5242880

# Base bwrap (bubblewrap) options used when --bwrap is passed to the script.
# Per-test writable output files are added automatically as --bind pairs.
bwrap_options = [
    "--ro-bind", "/", "/",
    "--proc", "/proc",
    "--dev", "/dev",
    "--tmpfs", "/tmp",
    "--die-with-parent",
]

